[project]
name = "reveil-musical"
version = "0.1.0"
description = "Réveil musical : un morceau selon le jour et la météo, notifié sur le canal préféré."
readme = "README.md"
authors = [
    { name = "Luca Ceccarelli", email = "lucabuco03@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dependency-injector>=4.49.1",
    "fastapi>=0.142.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
reveil-musical = "reveil_musical.api:run"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=reveil_musical --cov-report=term-missing --cov-fail-under=95"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "BLE"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]  # idiome FastAPI

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert est le mécanisme de pytest
